[[edge_functions]]
  path = "/share/vault"
  function = "vault-image"

[[edge_functions]]
  path = "/share/vault/*"
  function = "vault-image"

[[edge_functions]]
  path = "/share/prompt"
  function = "prompt-share"

[[edge_functions]]
  path = "/share/prompt/*"
  function = "prompt-share"

# Old store URL — replaces store.html's client-side meta-refresh redirect with a
# real server-side 301 (Google Search Console was flagging the old JS-based one)
[[redirects]]
  from = "/store.html"
  to = "/store-v2.html"
  status = 301
  force = true

# Firebase Auth handler — required for Google Sign-In popup/redirect
[[redirects]]
  from = "/__/auth/*"
  to = "https://promptaholics-534d3.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://promptaholics-534d3.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# Extensionless blog/tool URLs — force = true so these 301s override Netlify's
# default "pretty URL" behavior, which otherwise silently serves the .html file
# at BOTH the extensionless AND .html paths with a 200 (no redirect at all).
# That was causing Google Search Console's "Alternate page with proper canonical
# tag" validation to keep failing — canonical tags are a soft/advisory signal,
# and Google kept re-crawling both live 200 URLs instead of settling on one.
# A real 301 is an authoritative signal that resolves it outright, and also
# catches any future stray extensionless internal link before it becomes a
# repeat of this same issue.
[[redirects]]
  from = "/blog-best-marketing-prompts"
  to = "/blog-best-marketing-prompts.html"
  status = 301
  force = true

